<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>День 3 — Разные способы рассуждения</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <!-- ===== Сайдбар ===== -->
    <aside class="sidebar">
      <h1 class="title">День 3</h1>
      <p class="subtitle">Разные способы рассуждения</p>

      <section class="panel">
        <label class="field-label" for="taskSelect">Задача</label>
        <select id="taskSelect" class="select"></select>
      </section>

      <section class="panel" id="customPanel" hidden>
        <label class="field-label" for="customText">Своя задача</label>
        <textarea id="customText" class="textarea"
          placeholder="Вставьте текст своей задачи..."></textarea>
      </section>

      <section class="panel">
        <label class="field-label" for="modelSelect">Модель</label>
        <select id="modelSelect" class="select"></select>

        <label class="field-label" for="temperature">Temperature: <span id="tempVal">0.5</span></label>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.5" />
        <div class="temp-scale"><span>0</span><span>1</span></div>

        <label class="field-label" for="maxTokens">Лимит токенов: <span id="tokensVal">2000</span></label>
        <input type="range" id="maxTokens" min="1" max="10000" step="100" value="2000" />
        <div class="temp-scale"><span>1</span><span>10000</span></div>
      </section>

      <div class="actions">
        <button id="solveBtn" class="btn primary">Решить 4 способами</button>
      </div>

      <div id="errorBox" class="error-box" hidden></div>
    </aside>

    <!-- ===== Основная область ===== -->
    <main class="main">
      <div class="intro">
        <p>
          Ответ модели — функция от контекста. Один и тот же вопрос при разном
          управлении рассуждением даёт разную цену и разное качество — выбор
          стратегии такое же инженерное решение, как выбор алгоритма.
        </p>
      </div>

      <section id="taskPanel" class="task-panel" hidden>
        <div class="task-panel-head">
          <h2 id="taskHeading" class="task-heading"></h2>
        </div>
        <p id="taskText" class="task-text"></p>
      </section>

      <div id="grid" class="grid">
        <!-- 2x2 карточки решений -->
      </div>

      <section id="judgeSection" class="judge" hidden>
        <header class="judge-head">
          <h2>Вердикт судьи (LLM-as-a-judge)</h2>
          <button id="judgePromptBtn" class="hint-btn prompt-btn" title="Промпт, отправленный судье">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </button>
          <button class="hint-btn" data-hint="judge">?</button>
        </header>
        <div class="judge-body" id="judgeBody"></div>
      </section>
    </main>
  </div>

  <!-- Модал теоретических подсказок -->
  <div id="hintModal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="hintClose" aria-label="Закрыть">&times;</button>
      <h3 id="hintTitle"></h3>
      <p id="hintText"></p>
    </div>
  </div>

  <!-- Модал отправленного промпта -->
  <div id="promptModal" class="modal" hidden>
    <div class="modal-card prompt-card">
      <button class="modal-close" id="promptClose" aria-label="Закрыть">&times;</button>
      <h3 id="promptTitle"></h3>
      <pre id="promptText"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
